name: Build Kodi repository

# Rebuilds installable service packages from service.introskip main; 0.0.30 contains shutdown lifecycle fixes.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-repository.yml"
      - "_repo_generator.py"
      - "repo/repository.introskip/addon.xml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: introskip-kodi-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Rebuilds the feed from the current service source, including release 0.0.25.
      - name: Check out IntroSkip add-on source
        uses: actions/checkout@v4
        with:
          repository: zoeywowy/service.introskip
          ref: main
          path: service-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the IntroSkip add-on ZIP
        run: python service-source/build_zip.py

      - name: Prepare add-on folders for the repository generator
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil
          import xml.etree.ElementTree as ET

          source = Path("service-source")
          packages = sorted((source / "dist").glob("service.introskip-*.zip"))
          if not packages:
              raise SystemExit("The service build did not produce an installable ZIP.")

          package = packages[-1]
          with ZipFile(package) as archive:
              bad_file = archive.testzip()
              if bad_file:
                  raise SystemExit(f"Corrupt service ZIP member: {bad_file}")
              names = archive.namelist()
              if "service.introskip/addon.xml" not in names:
                  raise SystemExit("The service ZIP has no top-level service.introskip/addon.xml.")
              if "service.introskip/resources/lib/introdb.py" not in names:
                  raise SystemExit("The service ZIP is missing the IntroDB runtime module.")
              if any(name.startswith("service.introskip/repository/") for name in names):
                  raise SystemExit("Repository feed files must not be bundled inside the service add-on.")
              if any(name.startswith("service.introskip/tools/") for name in names):
                  raise SystemExit("Repository build tools must not be bundled inside the service add-on.")
              archive.extractall("repo")

          service_manifest = ET.parse("repo/service.introskip/addon.xml").getroot()
          if service_manifest.get("id") != "service.introskip":
              raise SystemExit("Unexpected add-on ID in the service package.")

          repository_art = Path("repo/repository.introskip")
          repository_art.mkdir(parents=True, exist_ok=True)
          shutil.copy2(source / "icon.png", repository_art / "icon.png")
          print(f"Prepared IntroSkip {service_manifest.get('version')}")
          PY

      - name: Clear previous generated packages
        run: |
          rm -rf repo/zips
          rm -f repository.introskip-*.zip

      - name: Generate Kodi index, checksums and versioned packages
        run: python _repo_generator.py

      - name: Validate repository metadata and package layout
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          import html
          import re
          import shutil
          import xml.etree.ElementTree as ET

          root = Path("repo")
          packages = root / "zips"
          index_path = packages / "addons.xml"
          checksum_path = packages / "addons.xml.md5"
          index_bytes = index_path.read_bytes()
          index = ET.fromstring(index_bytes)

          found = {item.get("id") for item in index.findall("addon")}
          expected = {"repository.introskip", "service.introskip"}
          if found != expected:
              raise SystemExit(f"Unexpected add-on index entries: {found}")

          expected_md5 = hashlib.md5(index_bytes).hexdigest()
          actual_md5 = checksum_path.read_text(encoding="ascii").strip()
          if actual_md5 != expected_md5:
              raise SystemExit("addons.xml.md5 does not match addons.xml")

          repository = ET.parse(root / "repository.introskip" / "addon.xml").getroot()
          directory = repository.find("./extension[@point='xbmc.addon.repository']/dir")
          raw = "https://raw.githubusercontent.com/zoeywowy/repository.introskip/main/repo/zips/"
          if directory is None:
              raise SystemExit("Repository add-on is missing its repository directory.")
          if directory.findtext("info") != raw + "addons.xml":
              raise SystemExit("The info URL is incorrect.")
          if directory.find("info").get("compressed") != "false":
              raise SystemExit("The info URL must declare compressed=false.")
          if directory.findtext("checksum") != raw + "addons.xml.md5":
              raise SystemExit("The checksum URL is incorrect.")
          if directory.findtext("datadir") != raw or directory.find("datadir").get("zip") != "true":
              raise SystemExit("The datadir URL must use the standard zip=true layout.")

          for addon_id in sorted(expected):
              manifest_path = root / addon_id / "addon.xml"
              manifest = ET.parse(manifest_path).getroot()
              version = manifest.get("version")
              package_path = packages / addon_id / f"{addon_id}-{version}.zip"
              if not package_path.is_file():
                  raise SystemExit(f"Missing package: {package_path}")
              if not (packages / addon_id / "addon.xml").is_file():
                  raise SystemExit(f"Missing copied metadata for {addon_id}")
              with ZipFile(package_path) as archive:
                  bad_file = archive.testzip()
                  if bad_file:
                      raise SystemExit(f"Corrupt ZIP member in {package_path}: {bad_file}")
                  member = f"{addon_id}/addon.xml"
                  if member not in archive.namelist():
                      raise SystemExit(f"{package_path} does not contain {member}")
                  packaged = ET.fromstring(archive.read(member))
                  if packaged.get("id") != addon_id or packaged.get("version") != version:
                      raise SystemExit(f"Manifest mismatch in {package_path}")
                  if addon_id == "service.introskip":
                      names = archive.namelist()
                      if any(name.startswith("service.introskip/repository/") for name in names):
                          raise SystemExit("The published service ZIP contains old repository files.")
                      if any(name.startswith("service.introskip/tools/") for name in names):
                          raise SystemExit("The published service ZIP contains repository build tools.")

          repository_version = repository.get("version")
          bootstrap = Path(f"repository.introskip-{repository_version}.zip")
          shutil.copy2(packages / "repository.introskip" / bootstrap.name, bootstrap)

          page = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="theme-color" content="#101827">
            <title>IntroSkip · Kodi 22 Repository</title>
            <style>
              :root {{ color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }}
              * {{ box-sizing: border-box; }}
              body {{ margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 18px; background: radial-gradient(circle at 15% 10%, #23395b 0, transparent 36%), #0b1220; color: #edf3ff; }}
              main {{ width: min(100%, 760px); padding: clamp(28px, 6vw, 56px); border: 1px solid #34445d; border-radius: 24px; background: linear-gradient(145deg, #172338, #101827 72%); box-shadow: 0 24px 80px #0007; }}
              .eyebrow {{ margin: 0 0 14px; color: #9bb5d7; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }}
              h1 {{ margin: 0; font-size: clamp(36px, 7vw, 58px); line-height: 1.04; letter-spacing: -.045em; }}
              .lead {{ max-width: 560px; margin: 18px 0 30px; color: #c4d0e1; font-size: 18px; line-height: 1.6; }}
              .download-row {{ display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin: 0 0 38px; }}
              .download {{ display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 22px; border-radius: 12px; background: #8dd8c7; color: #10231f; font-weight: 800; text-decoration: none; box-shadow: 0 8px 24px #0003; }}
              .download:focus, .download:hover {{ background: #b1f0e1; outline: 2px solid #d4fff4; outline-offset: 3px; }}
              .hint {{ color: #9eacc0; font-size: 13px; }}
              h2 {{ margin: 0 0 16px; font-size: 19px; }}
              ol {{ display: grid; gap: 12px; margin: 0; padding-left: 22px; color: #c4d0e1; line-height: 1.55; }}
              li::marker {{ color: #8dd8c7; font-weight: 800; }}
              code {{ color: #e7f3ff; overflow-wrap: anywhere; }}
              footer {{ margin-top: 34px; padding-top: 20px; border-top: 1px solid #34445d; color: #8f9fb5; font-size: 13px; }}
            </style>
          </head>
          <body>
            <main>
              <p class="eyebrow">Kodi 22 · Third-party repository</p>
              <h1>IntroSkip</h1>
              <p class="lead">Skip intros, recaps, previews and credits with community timestamps and Kodi's native chapter data. Install the repository once; Kodi handles future updates.</p>
              <div class="download-row">
                <a href="{bootstrap.name}" class="download">{bootstrap.name}</a>
                <span class="hint">Select this ZIP from Kodi's Install from zip file screen.</span>
              </div>
              <h2>Install in Kodi</h2>
              <ol>
                <li>Open <strong>Settings → File manager → Add source</strong>.</li>
                <li>Enter <code>https://zoeywowy.github.io/repository.introskip/</code> and name it <strong>IntroSkip Repository</strong>.</li>
                <li>Open <strong>Add-ons → Install from zip file</strong> and select the <strong>IntroSkip Repository</strong> source.</li>
                <li>Choose the ZIP listed above. Kodi will install the repository add-on.</li>
                <li>Open <strong>Install from repository → IntroSkip Repository → Services → IntroSkip</strong> and install IntroSkip.</li>
              </ol>
              <footer>IntroSkip is an independent community add-on for Kodi 22. The repository installer enables normal Kodi add-on updates.</footer>
            </main>
          </body>
          </html>
          """
          Path("index.html").write_text(page, encoding="utf-8")

          # Mirror Kodi 22 CHTTPDirectory's HTML anchor recognition.
          kodi_anchor = re.compile(
              r'<a href="([^"]*)"[^>]*>\s*(.*?)\s*</a>(.+?)(?=<a|</tr|$)',
              re.IGNORECASE | re.DOTALL,
          )
          visible_items = []
          for match in kodi_anchor.finditer(page):
              href = html.unescape(match.group(1)).strip().rstrip("/")
              label = html.unescape(re.sub(r"<[^>]+>", "", match.group(2))).strip().rstrip("/")
              if href and label == href:
                  visible_items.append(href)
          if bootstrap.name not in visible_items:
              raise SystemExit(
                  f"Kodi 22 HTTPDirectory would not list {bootstrap.name}; "
                  f"recognized entries: {visible_items}"
              )
          print(f"Kodi 22 HTTPDirectory test passed: {bootstrap.name} is visible.")
          print(f"Validated Kodi packages and prepared {bootstrap.name}")
          PY

      - name: Commit generated Kodi packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- repo/zips index.html 'repository.introskip-*.zip'
          if ! git diff --cached --quiet; then
            git commit -m "build: publish IntroSkip Kodi packages"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No package changes to publish."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp repository.introskip-*.zip site/
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public Kodi repository files
        run: |
          curl -fLsS --retry 8 --retry-all-errors --retry-delay 3 \
            "https://raw.githubusercontent.com/zoeywowy/repository.introskip/main/repo/zips/addons.xml" \
            -o /tmp/addons.xml
          curl -fLsS --retry 8 --retry-all-errors --retry-delay 3 \
            "https://raw.githubusercontent.com/zoeywowy/repository.introskip/main/repo/zips/addons.xml.md5" \
            -o /tmp/addons.xml.md5
          test "$(cat /tmp/addons.xml.md5)" = "$(md5sum /tmp/addons.xml | cut -d ' ' -f 1)"
          curl -fLsS --retry 8 --retry-all-errors --retry-delay 3 \
            "https://zoeywowy.github.io/repository.introskip/" \
            -o /tmp/introskip-index.html
          grep -q "repository.introskip-" /tmp/introskip-index.html
          BOOTSTRAP_NAME="$(grep -o 'repository.introskip-[0-9.]*\.zip' index.html | head -n 1)"
          test -n "$BOOTSTRAP_NAME"
          curl -fLsS --retry 8 --retry-all-errors --retry-delay 3 \
            "https://zoeywowy.github.io/repository.introskip/$BOOTSTRAP_NAME" \
            -o "/tmp/$BOOTSTRAP_NAME"
          python - <<'PY'
          import glob
          import html
          import re
          from pathlib import Path
          from zipfile import ZipFile

          paths = glob.glob("/tmp/repository.introskip-*.zip")
          if not paths:
              raise SystemExit("The GitHub Pages bootstrap ZIP could not be downloaded.")
          with ZipFile(paths[0]) as archive:
              if archive.testzip():
                  raise SystemExit("The GitHub Pages bootstrap ZIP is corrupt.")
              if "repository.introskip/addon.xml" not in archive.namelist():
                  raise SystemExit("The bootstrap ZIP is missing repository.introskip/addon.xml.")

          bootstrap_name = Path(paths[0]).name
          deployed_page = Path("/tmp/introskip-index.html").read_text(encoding="utf-8")
          # Use Kodi 22 CHTTPDirectory's actual anchor pattern: href must be first.
          pattern = re.compile(
              r'<a href="([^"]*)"[^>]*>\s*(.*?)\s*</a>(.+?)(?=<a|</tr|$)',
              re.IGNORECASE | re.DOTALL,
          )
          visible = []
          for match in pattern.finditer(deployed_page):
              href = html.unescape(match.group(1)).strip().rstrip("/")
              label = html.unescape(re.sub(r"<[^>]+>", "", match.group(2))).strip().rstrip("/")
              if href and label == href:
                  visible.append(href)
          if bootstrap_name not in visible:
              raise SystemExit(
                  f"Deployed HTML is not Kodi-browseable. "
                  f"Expected {bootstrap_name}; Kodi-style parser found {visible}"
              )
          print(f"GitHub Pages bootstrap ZIP is valid and Kodi-visible: {bootstrap_name}")
          PY
          grep -q "href=\"$BOOTSTRAP_NAME\"" /tmp/introskip-index.html
          ! grep -q "Add this source in Kodi" /tmp/introskip-index.html
          echo "Raw GitHub index, checksum, Kodi-safe instructions and bootstrap ZIP are reachable."
